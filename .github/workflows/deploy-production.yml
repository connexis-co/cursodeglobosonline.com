name: Deploy Production

on:
  push:
    branches: [main]

# Un solo deploy a producción a la vez (este y ratings-refresh.yml comparten el grupo).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
      # continue-on-error: un fallo de release-please no debe bloquear el deploy a producción
      - uses: googleapis/release-please-action@v4
        continue-on-error: true
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=cursodeglobosonline-com --branch=main
      # Avisa a Bing/Yandex/Seznam/Naver/Yep de URLs nuevas o actualizadas (lastmod de los
      # últimos 2 días). Solo producción: la clave está atada al host cursodeglobosonline.com.
      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
