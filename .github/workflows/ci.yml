name: EmDash migration checks
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run content:seed
      - run: git diff --exit-code -- emdash.seed.json
      - run: npm run test:migration
      - run: npm run check
      - run: npm run build
